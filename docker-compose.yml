version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16                                                           
    container_name: ai-food-db
    restart: always
    environment:
      POSTGRES_USER: ai_food
      POSTGRES_PASSWORD: devpassword123
      POSTGRES_DB: ai_food_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_food"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ai-food-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  postgres_data:
  redis_data: